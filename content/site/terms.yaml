title: "Terms of use"
intro: "Please read these terms when using the CMAX Foundation website. The site shares information about the foundation, its work and proposals for support."
updated: "2026-09-28"
reviewNote: "Pending legal review: CMAX has not yet confirmed the governing law or jurisdiction. These terms do not claim that a lawyer has approved them."
sections:
  - title: "Using this website"
    text: "This website is operated by CMAX Foundation, Inc. Use it to learn about the foundation and make relevant inquiries. Do not interfere with its operation, attempt unauthorized access or submit unlawful or misleading material. Sending an inquiry does not create a funding agreement, partnership, service contract or confirmed deployment."
  - title: "Not a medical or emergency service"
    text: "This website is informational. It does not provide medical advice, diagnosis, treatment, emergency dispatch or real-time disaster response. Information about field hospitals, humanitarian habitat and disaster preparedness is not an instruction to use a product for a particular medical or rescue situation.\n\nDo not rely on this website or its contact form in a real emergency. Contact the emergency services available where you are. CMAX does not promise immediate monitoring or response to website messages."
  - title: "Content and intellectual property"
    text: "Website text, photographs, designs, logos and other materials may belong to CMAX Foundation or their respective creators and rights holders. Making them available here does not transfer ownership or grant a license to reuse them beyond what applicable law permits. Ask the relevant rights holder before republishing or using protected material. Do not imply CMAX endorsement without its permission."
  - title: "Cmax Med, AeroCabin and Cmax System"
    text: "Cmax Med and AeroCabin™ are brands and products of Cmax System, not of CMAX Foundation. References to these products explain their connection to humanitarian work; they do not mean that the foundation owns their product designs, trademarks or associated intellectual property.\n\nThis website is not a product sale, warranty, certification or promise of suitability. Product illustrations and concepts do not establish a confirmed deployment. Any product specifications, permissions, supply commitments or commercial terms must be confirmed with the appropriate rights holder or supplier."
  - title: "Links and third-party services"
    text: "The website links to external sources and may offer videos hosted by third parties. Those websites and services are controlled by their own operators and have their own terms and privacy notices. CMAX does not control their availability or content. A link does not by itself imply an endorsement or agreement."
  - title: "Availability and accuracy"
    text: "Information is provided for general understanding and may change, become outdated or contain errors. CMAX does not guarantee uninterrupted access, error-free content or suitability for a particular purpose. Confirm current facts directly before making decisions that depend on them."
  - title: "Responsibility and limits"
    text: "To the extent permitted by applicable law, CMAX does not accept responsibility for loss arising from reliance on general website information, interruptions to the website or the use of external websites. Nothing here excludes responsibility or rights that cannot lawfully be excluded. The scope and enforceability of these terms remain subject to legal review."
  - title: "Governing law"
    text: "Pending confirmation by CMAX and its legal advisor: the governing law and jurisdiction for these terms. The foundation's registration in the United States and listed address in Washington, DC do not by themselves settle this choice."
  - title: "Updates and contact"
    text: "Changes will be published on this page with a revised last-updated date. For questions about the website or permission to reuse material, use the foundation's general Contact details in the footer. For information about inquiry data, read the Privacy notice."
