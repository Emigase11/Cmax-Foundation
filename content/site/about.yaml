intro: CMAX Foundation is a humanitarian organization that helps communities, first responders and institutions prepare for complex emergencies. It grew out of two decades of work on rapid habitat and emergency response design, and it works with public institutions, universities, companies and the United Nations system.
mission: To work around the globe to provide, promote and support innovative ideas and sustainable solutions that improve the quality of life of survivors of conflicts, people displaced by natural disasters, disease outbreaks and complex emergencies, by rapidly delivering humanitarian habitat and aid solutions.
vision: A world where the most vulnerable, unprotected and underserved people have access to a better, healthier, more dignified and happier life.
values:
  - name: Humanity
    text: People first, in every decision about what to deploy and where.
  - name: Solidarity
    text: We work alongside the responders and institutions already serving their communities.
  - name: Integrity
    text: We publish what we have done, not what we intend to do.
  - name: Accountability
    text: Every action is documented, attributed correctly and open to review.
  - name: Independence
    text: Our humanitarian decisions are not for sale.
  - name: Creativity
    text: Better tools, designed with the people who use them.
  - name: Earth-friendly
    text: Reusable, relocatable solutions that leave less behind.
  - name: Passion
    text: Preparedness is slow work. We stay with it.
history:
  - year: '2015'
    text: The CMAX rapid habitat system is presented to Pope Francis and featured internationally as a disaster relief innovation.
  - year: '2016'
    text: CMAX Foundation is established in Washington, D.C. as a 501(c)(3) nonprofit.
  - year: '2017'
    text: The Emergency Research CMAX Fund is created to study emergency assistance needs directly with affected communities.
  - year: '2018'
    text: First Social Innovation Lab for Emergencies (LISE) with Universidad de Monterrey, with a workshop in Oaxaca after the 2017 earthquakes.
  - year: '2019'
    text: Launch of a public-private network for disaster risk reduction in Mexico. Intervention at the United Nations on 9 December.
  - year: '2020'
    text: COVID-19 response concepts for mobile medical, laboratory and staff-rest units.
  - year: '2021'
    text: Special consultative status with the United Nations Economic and Social Council (ECOSOC).
  - year: '2022'
    text: Public donations directed to the development of units for Ukraine.
model: When operational costs are covered through private donors, sponsors and partners, public donations can be directed to field programs and humanitarian action.
transparency:
  - question: How are donations used?
    answer: Donations received for a specific campaign are reserved for that campaign. General donations support field programs. Operating costs (staff, office, systems) are covered by Cmax System Inc., private donors, foundations and sponsors whenever possible.
  - question: How are missions selected?
    answer: A mission starts with a documented need from a first-responder team, a health institution or a community, a confirmed recipient, and a response CMAX can actually deliver. Requests are reviewed by the Foundation before they are published.
  - question: How are campaigns reviewed?
    answer: Before a campaign uses the name or identity of a fire department, civil defense organization or public institution, CMAX Foundation confirms the recipient. Until then the campaign is shown as proposed with recipient confirmation pending.
  - question: How are outcomes documented?
    answer: Each delivered mission gets a public record with the location, the date, the recipient, photographs and the confirmed result. Figures without backing are not published.
  - question: Where are the legal and financial documents?
    answer: CMAX Foundation, Inc. (EIN 81-4301126) is registered as a 501(c)(3) nonprofit. Its public profile is available on GuideStar. Financial reports will be added to this page as they are published.
teamNote: Profiles are shown once CMAX Foundation confirms that each person is currently active and their exact role. Team members and advisors listed on the previous website are being confirmed.
