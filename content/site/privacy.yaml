title: "Privacy notice"
intro: "How CMAX Foundation handles information when you visit this website or send a Support a Mission inquiry."
updated: "2026-09-28"
reviewNote: "Pending CMAX confirmation: the retention period for inquiries and the dedicated contact for privacy requests. These decisions are not yet finalized."
formNotice: "We store your inquiry to reply."
formLinkLabel: "Read our privacy notice."
sections:
  - title: "Who is responsible"
    text: "CMAX Foundation, Inc. is responsible for the inquiries collected through this website. It is a nonprofit organization registered in the United States, with its listed address at 2200 Pennsylvania Avenue, N.W., 4th Floor East Tower, Washington, District of Columbia 20037, United States."
  - title: "What you provide"
    text: "The Support a Mission form requires your name, email address, reason for contacting us and message. Your organization is optional. You do not need to send a message to browse the website. The form does not request payment details.\n\nPlease do not include medical records or other sensitive information about yourself or another person in your message. This form is for inquiries, not medical care or emergency assistance."
  - title: "Information included automatically"
    text: "When you submit the form, it includes the current page URL and, when present, the identifier and label of the campaign or action linked to your inquiry. The server adds the date and time of receipt. This helps CMAX understand and follow up on your request.\n\nVercel hosts the website and processes technical information needed to serve and secure it, including request logs and IP addresses. The inquiry record itself does not add your IP address to the email or spreadsheet."
  - title: "How the information is used"
    text: "CMAX uses inquiry information to read and respond to your message, understand the project you are asking about and keep a record for follow-up. The website has no newsletter sign-up or advertising audience integration."
  - title: "Service providers and international processing"
    text: "The form is connected to Resend for delivery by email to CMAX and to Google Sheets for a record of the inquiry. Each route operates when configured; a submission can succeed through either route. These services receive the inquiry fields and context described above. People handling CMAX inquiries can read the delivered messages and records.\n\nResend stores data in the United States. Google is a US-based provider and may process data in the United States and other countries. Vercel is also a US-based provider with international infrastructure. If you visit from Europe or another region, using these services can involve transferring your information outside your country, including to the United States. No particular regional storage setting or transfer arrangement is claimed here.\n\nIn local development, the application also attempts to write an inquiry file on disk. The deployed Vercel website has a read-only application filesystem, so this is not a production storage route."
  - title: "Cookies, analytics and video"
    text: "The public website currently sets no cookies and uses no advertising tracking. No visitor analytics service is installed. This notice describes the public website, not the separate editor sign-in used by CMAX staff.\n\nEmbedded YouTube players load only after you choose to play a video. They use youtube-nocookie.com, YouTube's privacy-enhanced mode. Playing a video connects your browser to Google, which receives technical information such as your IP address. Privacy-enhanced mode is not a promise that Google processes no data. External websites and video services have their own privacy practices. Videos hosted directly on this website are served through its hosting provider."
  - title: "How long information is kept"
    text: "Pending CMAX confirmation: how long inquiries are retained in email and Google Sheets, and how deletion is carried out across those copies. No fixed retention or automatic deletion schedule has yet been confirmed. Hosting and delivery providers also have their own log-retention settings; the settings for this deployment have not been confirmed."
  - title: "Access, corrections, deletion and objections"
    text: "You can ask to see the personal information held about your inquiry, correct it, request its deletion or object to its use. The rights and limits that apply depend on your circumstances and applicable law; this notice does not claim that a particular legal regime has been assessed.\n\nPending CMAX confirmation: the email address and process for exercising these rights. Until that route is confirmed, the Contact details in the site footer are the general way to reach the foundation and ask where to direct a privacy request. Include enough context to locate your inquiry, such as the email used and approximate submission date; do not send identity documents unless a secure verification process has been arranged."
  - title: "Changes to this notice"
    text: "Updates will be published on this page with a revised last-updated date. Changes to the form, providers, tracking or retention practices should be reflected here and in the form notice before those changes take effect."
